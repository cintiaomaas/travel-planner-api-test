name: CI - Playwright API Testes

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

env:
  CI: true
  API_BASE_URL: https://meu-travel-planner.vercel.app

jobs:
  test:
    name: Testes API
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Aguardar API disponível
        shell: bash
        run: |
          for i in {1..60}; do
            if curl --fail --silent --show-error "$API_BASE_URL" > /dev/null; then
              echo "API disponível"
              exit 0
            fi

            echo "Aguardando API..."
            sleep 2
          done

          echo "API não disponível"
          exit 1

      - name: Executar testes Playwright
        run: npm test

      - name: Publicar relatório como artifact
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Preparar relatório para GitHub Pages
        if: ${{ always() && !cancelled() && github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: playwright-report/

  deploy:
    name: Publicar relatório no GitHub Pages

    if: ${{ always() && !cancelled() && github.event_name != 'pull_request' }}

    needs: test

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar Playwright Report
        id: deployment
        uses: actions/deploy-pages@v4